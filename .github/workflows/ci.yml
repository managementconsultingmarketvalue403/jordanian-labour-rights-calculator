name: Tests and Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run calculator tests
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchronize Android web assets
        run: |
          npm run prepare:android
          npx cap sync android

      - name: Verify Android project
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Preserve testing package
        uses: actions/upload-artifact@v4
        with:
          name: labour-rights-calculator-testing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
